description: >-
  FinOps view of MyShipTracking API spend. Cost is driven by a credit meter:
  every successful call deducts credits by endpoint and response detail (1 for
  simple, 3 for extended, 5 per distinct date for history and port calls; no
  charge on empty results), capped at 500 credits per request. Credits come
  either from a monthly subscription allowance (Basic 50,000 / Standard 200,000 /
  Unlimited) billed in EUR, or from a pay-per-use "Coin Charge" balance.
  Subscription credits expire at the end of each billing period and do not roll
  over, so the primary optimization levers are choosing simple over extended
  responses, narrowing bounding boxes and date ranges, and right-sizing the plan
  to actual monthly credit burn.
notes: >-
  Subscription list prices captured 2026-07-12 (EUR, excl. VAT): Basic EUR 90,
  Standard EUR 185, Unlimited EUR 350 per month. Coin-package unit prices for the
  pay-per-use model are not published and are not reconciled here.
