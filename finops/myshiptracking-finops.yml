meters:
- name: api_credits
  description: Credits deducted per call by endpoint and response detail (simple 1, extended 3, history/port-calls 5 per distinct date).
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
  - response_detail
- name: vessels_returned
  description: Per-vessel credit charges on zone and nearby queries scale with the number of vessels returned.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: distinct_dates
  description: History track and port-call queries are billed 5 credits per distinct date in the result set.
  unit: dates
  aggregation: sum
  dimensions:
  - account
  - endpoint
principles:
- name: Visibility
  description: Track credit burn by endpoint and response detail via the Account Info endpoint (available_coins); watch monthly allowance depletion.
- name: Allocation
  description: Attribute credit spend to workloads by endpoint and response detail so extended/history-heavy consumers are identified.
- name: Optimization
  description: Prefer simple over extended responses, tighten bounding boxes and lookback windows, batch vessel lookups, and right-size the subscription tier to actual monthly credit usage since credits do not roll over.
- name: Accountability
  description: Assign an owner to the subscription; review monthly credit consumption against the plan allowance and against the 500-credit per-request cap.
