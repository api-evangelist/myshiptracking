aid: myshiptracking
name: MyShipTracking
review:
  question: Does MyShipTracking expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. MyShipTracking's documented public API is
    entirely request/response REST over HTTPS (base
    https://api.myshiptracking.com/api/v2), returning a JSON or XML envelope.
    There is no documented server-push transport - no WebSocket (wss://), no
    Server-Sent Events, and no webhook - on MyShipTracking's own API to model.
    "Real-time" here means the freshest terrestrial-AIS position available at the
    moment of a REST call, delivered as a normal HTTP response, not a live stream.
findings:
  summary: |
    MyShipTracking does NOT publish a documented public WebSocket API. The
    product is a terrestrial-AIS vessel-tracking platform whose developer API is
    a credit-metered REST API at https://api.myshiptracking.com/api/v2. Every
    documented endpoint is an HTTPS GET returning a standardized envelope
    (status, duration, timestamp, data) in JSON (default) or XML. Authentication
    is an API key passed as `Authorization: Bearer YOUR_API_KEY` or the
    `x-api-key` header. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint - and no SSE or webhook callback - is documented
    anywhere in the MyShipTracking API reference, getting-started guide, or
    pricing pages as of the review date. Live AIS streaming over WebSockets is a
    feature of some competing platforms (e.g. aisstream.io), but MyShipTracking
    is not one of them.
  accessModel: |
    Paid and credit-metered. One free trial key per user (2,000 coins, max 10
    days active, 90 calls/minute). Production access is either a monthly
    subscription with a fixed monthly credit allowance (Basic 50k credits,
    Standard 200k credits, Unlimited) or a pay-per-use "Coin Charge" balance.
    Credits deduct per call by endpoint and response detail; unused subscription
    credits do not roll over. Coverage is terrestrial AIS only (nearshore).
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.myshiptracking.com/api/v2
      documented: true
      note: All documented endpoints are HTTPS GET requests returning a JSON/XML envelope.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in MyShipTracking's API reference, getting-started guide, or pricing pages as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events streaming is documented.
    - protocol: Webhook
      scheme: https
      documented: false
      note: No webhook / server-to-endpoint callback is documented on MyShipTracking's own API.
  endpointsConfirmedRest:
    - GET https://api.myshiptracking.com/api/v2/vessel
    - GET https://api.myshiptracking.com/api/v2/vessel/zone
    - GET https://api.myshiptracking.com/api/v2/vessel/nearby
    - GET https://api.myshiptracking.com/api/v2/vessel/track
    - GET https://api.myshiptracking.com/api/v2/vessel/search
    - GET https://api.myshiptracking.com/api/v2/port
    - GET https://api.myshiptracking.com/api/v2/port/estimate
    - GET https://api.myshiptracking.com/api/v2/port/calls
    - GET https://api.myshiptracking.com/api/v2/account/info
  endpointsModeledOrUnverifiedPath:
    - GET https://api.myshiptracking.com/api/v2/vessel/bulk
    - GET https://api.myshiptracking.com/api/v2/port/search
    - GET https://api.myshiptracking.com/api/v2/port/in-port (Vessels In Port)
    - Fleets endpoints (My Fleets, New/Edit/Delete Fleet, Add/Delete/List Vessel in Fleet, Fleet Status)
  modeledNote: |
    Paths under endpointsConfirmedRest were read directly from each endpoint's
    own documentation page and reflect confirmed method + path + parameters.
    The "bulk" vessel endpoint, port search, vessels-in-port, and the eight
    Fleet endpoints are documented as existing in the API navigation, but their
    exact URL paths and parameter sets were not individually confirmed page by
    page; the /vessel/bulk path shown is inferred and should be verified against
    the Bulk Vessel Retrieval doc. Response schemas in the OpenAPI are modeled
    from the documented field lists; field-by-field types beyond what the docs
    state are best-effort and marked accordingly.
sources:
