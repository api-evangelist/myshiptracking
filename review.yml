    note: GET /api/v2/vessel/zone; bounding box; 1/3 credits per vessel.
  - url: https://api.myshiptracking.com/docs/vessels-nearby
    type: APIReference
    note: GET /api/v2/vessel/nearby; radius in NM; 1/3 credits per vessel.
  - url: https://api.myshiptracking.com/docs/vessel-historical-track-api
    type: APIReference
    note: GET /api/v2/vessel/track; date range/days + timegroup; 5 credits per distinct date.
  - url: https://api.myshiptracking.com/docs/vessel-search
    type: APIReference
    note: GET /api/v2/vessel/search; name >= 3 chars; 1 credit.
  - url: https://api.myshiptracking.com/docs/port-details
    type: APIReference
    note: GET /api/v2/port; port_id|unloco; 1 credit.
  - url: https://api.myshiptracking.com/docs/port-estimate-arrivals
    type: APIReference
    note: GET /api/v2/port/estimate; eta_utc/eta_local; 1 credit per record.
  - url: https://api.myshiptracking.com/docs/port-calls
    type: APIReference
    note: GET /api/v2/port/calls; arrivals/departures; 5 credits per distinct date.
  - url: https://api.myshiptracking.com/docs/account-info
    type: APIReference
    note: GET /api/v2/account/info; account_type Coin Charge or Subscription; available_coins; free.
  - url: https://api.myshiptracking.com/api-pricing
    type: Pricing
    note: Basic EUR90/50k credits, Standard EUR185/200k credits, Unlimited EUR350; monthly.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. MyShipTracking's own public API is
    request/response REST over HTTPS, returning a JSON/XML envelope. No AsyncAPI
    document was created because there is no server-push transport (WebSocket,
    SSE, or webhook) on MyShipTracking's own API to model.
